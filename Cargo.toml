[workspace]
resolver = "2"
members = [
    "contracts/token",
    "contracts/price_oracle",
    "contracts/lending_pool",
    "contracts/governance",
]

[workspace.dependencies]
soroban-sdk = "22.0.11"
soroban-token-sdk = "22.0.11"
ed25519-dalek = "=2.1.1"
curve25519-dalek = "=4.1.3"
rand_core = "=0.6.4"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
